<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Voice Rooms Live</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#f59e0b;--danger:#ef4444;--ok:#22c55e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px}
  h1{margin:8px 0 4px;font-size:28px}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid transparent;background:#0f172a;color:var(--text);font-size:16px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  .code-in{text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:700}
  button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  .primary{background:var(--accent);color:#1a1200;width:100%;margin-top:12px}
  .ghost{background:#0f172a;color:var(--text)}
  .or{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0}
  .opt{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--text)}
  .opt input{width:20px;height:20px;accent-color:var(--accent)}
  h2{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  h2 button{padding:6px 12px;font-size:13px}
  .rl{display:flex;flex-direction:column;gap:8px}
  .ri{display:flex;justify-content:space-between;align-items:center;background:#0f172a;border-radius:12px;padding:12px 14px;cursor:pointer}
  .ri b{letter-spacing:3px;color:var(--accent)}
  .ri span{font-size:13px;color:var(--muted)}
  .none{color:var(--muted);font-size:14px;text-align:center;padding:10px}
  #room{display:none}
  .roomhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .roomcode{font-size:26px;font-weight:800;letter-spacing:4px;color:var(--accent)}
  .status{font-size:13px;color:var(--muted);margin-top:4px}
  ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .p{background:var(--card);border-radius:16px;padding:14px 6px;text-align:center;border:3px solid transparent;transition:border-color .15s,box-shadow .15s}
  .p.speaking{border-color:var(--ok);box-shadow:0 0 14px rgba(34,197,94,.5)}
  .av{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#1a1200;font-weight:800;font-size:20px;display:grid;place-items:center;margin:0 auto 6px}
  .nm{font-size:13px;font-weight:600;word-break:break-word}
  .mt{font-size:11px;color:var(--danger);height:14px}
  .controls{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:none}
  .controls .row{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .controls .row>*{flex:1}
  .mute.on{background:var(--danger);color:#fff}
  .leave{background:#7f1d1d;color:#fff}
  #err{color:var(--danger);font-size:14px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div id="lobby">
    <h1>🎙️ Voice Rooms Live</h1>
    <p class="sub">अपना रूम बनाओ या किसी भी पब्लिक रूम में जुड़ो।</p>

    <div class="card">
      <label for="name">आपका नाम</label>
      <input id="name" type="text" maxlength="20" placeholder="जैसे: Rahul" autocomplete="off">
      <label class="opt"><input type="checkbox" id="pub"> पब्लिक रूम बनाओ (सबको लिस्ट में दिखेगा)</label>
      <label class="opt"><input type="checkbox" id="listen"> सिर्फ सुनना है (माइक बंद)</label>
      <button class="primary" id="create">➕ नया रूम बनाओ</button>
      <div class="or">— या कोड से जुड़ो —</div>
      <input id="code" type="text" class="code-in" maxlength="6" placeholder="ABC123" autocomplete="off" style="margin-top:10px">
      <button class="primary" id="join">🚪 रूम में जुड़ो</button>
      <div id="err"></div>
    </div>

    <div class="card">
      <h2>🌍 पब्लिक रूम <button class="ghost" id="refresh">रिफ्रेश</button></h2>
      <div class="rl" id="rooms"><div class="none">लोड हो रहा है…</div></div>
    </div>
  </div>

  <div id="room">
    <div class="card">
      <div class="roomhead">
        <div>
          <div class="roomcode" id="rc"></div>
          <div class="status" id="st">जुड़ रहे हैं…</div>
        </div>
        <button class="ghost" id="share">🔗 शेयर</button>
      </div>
    </div>
    <ul id="plist"></ul>
    <div style="height:110px"></div>
  </div>
</div>

<div class="controls" id="controls">
  <div class="row">
    <button class="ghost mute" id="mute">🎤 Mute</button>
    <button class="leave" id="leave">📞 बाहर निकलो</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const { Room, RoomEvent, Track } = LivekitClient;
  let room = null, code = '', isListener = false;
  const API = '/.netlify/functions/';

  try { $('name').value = localStorage.getItem('vr.name') || ''; } catch(e){}
  if (location.hash.length > 1) $('code').value = location.hash.slice(1).toUpperCase().slice(0,6);

  const err = m => { $('err').textContent = m || ''; };
  const rand = n => Array.from({length:n}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
  const setStatus = t => { $('st').textContent = t; };

  async function loadRooms() {
    const box = $('rooms');
    try {
      const r = await fetch(API + 'rooms');
      if (!r.ok) throw new Error();
      const list = await r.json();
      box.innerHTML = '';
      if (!list.length) { box.innerHTML = '<div class="none">अभी कोई पब्लिक रूम नहीं है। पहला आप बनाओ!</div>'; return; }
      list.forEach(x => {
        const c = x.room.slice(4);
        const d = document.createElement('div'); d.className = 'ri';
        d.innerHTML = '<b>' + c + '</b><span>👥 ' + x.n + '</span>';
        d.onclick = () => { $('code').value = c; start(false, 'pub_' + c); };
        box.appendChild(d);
      });
    } catch(e) { box.innerHTML = '<div class="none">लिस्ट लोड नहीं हो सकी</div>'; }
  }

  async function start(create, forcedRoom) {
    err('');
    const name = $('name').value.trim();
    if (!name) return err('पहले अपना नाम लिखो');
    try { localStorage.setItem('vr.name', name); } catch(e){}

    let roomName;
    if (forcedRoom) { roomName = forcedRoom; code = forcedRoom.slice(4); }
    else if (create) { code = rand(6); roomName = ($('pub').checked ? 'pub_' : 'prv_') + code; }
    else {
      code = $('code').value.trim().toUpperCase();
      if (code.length !== 6) return err('रूम कोड 6 अक्षर का होना चाहिए');
      roomName = 'prv_' + code;
    }
    isListener = $('listen').checked;

    try {
      // रूम का नाम pub_ या prv_ से शुरू होता है; जुड़ने वाले के लिए दोनों आज़माते हैं
      const tryJoin = async rn => {
        const r = await fetch(API + 'token?room=' + rn + '&name=' + encodeURIComponent(name) + '&listener=' + (isListener ? 1 : 0));
        if (!r.ok) throw new Error('token');
        return r.json();
      };
      const { token, url } = await tryJoin(roomName);

      room = new Room({ adaptiveStream: true, dynacast: true });
      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === Track.Kind.Audio) document.body.appendChild(track.attach());
      });
      room.on(RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach(e => e.remove()));
      [RoomEvent.ParticipantConnected, RoomEvent.ParticipantDisconnected,
       RoomEvent.TrackMuted, RoomEvent.TrackUnmuted, RoomEvent.TrackPublished,
       RoomEvent.ActiveSpeakersChanged].forEach(ev => room.on(ev, render));
      room.on(RoomEvent.Disconnected, () => { if (room) leave(true); });

      await room.connect(url, token);
      await room.startAudio();
      if (!isListener) {
        try { await room.localParticipant.setMicrophoneEnabled(true); }
        catch(e) { err('माइक की अनुमति नहीं मिली, सिर्फ सुन सकते हो'); isListener = true; }
      }
      show();
      render();
    } catch(e) {
      if (room) { try { room.disconnect(); } catch(_){} room = null; }
      err('जुड़ नहीं सके। इंटरनेट और सर्वर सेटिंग चेक करो।');
    }
  }

  function render() {
    if (!room) return;
    const ul = $('plist'); ul.innerHTML = '';
    const all = [room.localParticipant, ...room.remoteParticipants.values()];
    all.forEach(p => {
      const me = p === room.localParticipant;
      const li = document.createElement('li');
      li.className = 'p' + (p.isSpeaking ? ' speaking' : '');
      const nm = (p.name || p.identity || '?') + (me ? ' (आप)' : '');
      const av = document.createElement('div'); av.className = 'av'; av.textContent = (nm.trim()[0] || '?').toUpperCase();
      const n = document.createElement('div'); n.className = 'nm'; n.textContent = nm;
      const m = document.createElement('div'); m.className = 'mt';
      const canTalk = p.permissions ? p.permissions.canPublish : true;
      m.textContent = !canTalk ? '👂 सुन रहे' : (!p.isMicrophoneEnabled ? '🔇 muted' : '');
      li.append(av, n, m); ul.appendChild(li);
    });
    setStatus(all.length + ' लोग रूम में');
    $('mute').style.display = isListener ? 'none' : '';
  }

  function show() {
    $('lobby').style.display = 'none';
    $('room').style.display = 'block';
    $('controls').style.display = 'block';
    $('rc').textContent = code;
    history.replaceState(null, '', '#' + code);
  }

  function leave(fromEvent) {
    const r = room; room = null;
    if (r && !fromEvent) { try { r.disconnect(); } catch(e){} }
    document.querySelectorAll('audio').forEach(a => a.remove());
    $('mute').classList.remove('on'); $('mute').textContent = '🎤 Mute';
    $('room').style.display = 'none';
    $('controls').style.display = 'none';
    $('lobby').style.display = 'block';
    history.replaceState(null, '', location.pathname);
    loadRooms();
  }

  $('create').onclick = () => start(true);
  $('join').onclick = () => start(false);
  $('refresh').onclick = loadRooms;
  $('leave').onclick = () => leave(false);
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') start(false); });

  $('mute').onclick = async () => {
    if (!room) return;
    const on = room.localParticipant.isMicrophoneEnabled;
    await room.localParticipant.setMicrophoneEnabled(!on);
    $('mute').classList.toggle('on', on);
    $('mute').textContent = on ? '🔇 Unmute' : '🎤 Mute';
    render();
  };

  $('share').onclick = async () => {
    const url = location.origin + location.pathname + '#' + code;
    const text = 'मेरे Voice Room में जुड़ो! कोड: ' + code;
    try {
      if (navigator.share) await navigator.share({ title: 'Voice Room', text, url });
      else { await navigator.clipboard.writeText(text + '\n' + url); setStatus('लिंक कॉपी हो गया ✅'); }
    } catch(e){}
  };

  loadRooms();
})();
</script>
</body>
</html>
